<!DOCTYPE html>
<html lang="en">

<head>
    <title>Static page with Shadow DOM</title>

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div#shadow-root {
            border: 3px solid purple;
            padding: 10px;
            overflow: hidden; /* ensures elements do not overflow the container */
        }
    </style>
</head>

<body data-some-property-one>

    <div id="shadow-root"></div>

    <script>
        // create a shadow root
        let shadowTarget = document.getElementById("shadow-root");
        let shadow = shadowTarget.attachShadow({ mode: "open" });

        // create elements for shadow dom
        let shadowButton = document.createElement("button");
        let shadowParagraph = document.createElement("p");
        let shadowStyles = document.createElement("style");

        // add styles for shadow dom elements
        shadowStyles.textContent = `
            button {
                color: white;
                background-color: red;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                font-size: 16px;
            }
            p {
                color: purple;
                font-weight: bold;
                margin: 10px 0 0;
                position: relative;
                transition: transform 0.5s ease-in-out, color 0.5s;
            }
            p.moving {
                transform: translateX(300px);
                color: orange;
            }
        `;

        // set button and paragraph content
        shadowButton.type = "button";
        shadowButton.textContent = "Move Text";
        shadowParagraph.textContent = "This text will move right.";

        // append styles and elements to the shadow root
        shadow.appendChild(shadowStyles);
        shadow.appendChild(shadowButton);
        shadow.appendChild(shadowParagraph);

        // add event listener to toggle movement and text change
        shadowButton.addEventListener("click", () => {
            if (shadowParagraph.classList.toggle("moving")) {
                shadowParagraph.textContent = "The text has moved right.";
            } else {
                shadowParagraph.textContent = "This text will move right.";
            }
        });
    </script>

</body>

</html>
