<!doctype html>
<!-- simple wrapper that shows the image at its natural size -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>full-size image viewer</title>
    <style>
      /* remove default margins so the image touches the edge of the window */
      html, body { margin: 0; }

      /* display image without any scaling or scrollbars around it */
      img { display: block; }
    </style>
  </head>

  <body>
    <!-- this image will be shown at its original resolution, with scrolling if needed -->
    <img src="http://170.64.226.39/_ipx/q_100/KCnCm6bcpwc1.png" alt="full-size png" />
  </body>
</html>
